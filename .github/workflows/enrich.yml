name: Enrichment monitor (monthly)

# Separate from the 6-hour data sync (sync.yml). This job re-fetches every
# active vendor URL, compares content hashes to the stored baseline, and emits
# a diff of changed pages that routes into targeted re-verification.

on:
  schedule:
    - cron: '0 6 1 * *'      # 06:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: monitor
        options: [monitor, baseline]
      limit:
        description: 'Cap URLs processed (blank = all; use a small number to test)'
        type: string
        required: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the changed-pages diff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "pyairtable>=3,<4"

      - name: Run enrichment monitor
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          ENRICH_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "baseline" ]; then
            python .github/scripts/enrich.py --baseline
          else
            python .github/scripts/enrich.py
          fi

      # P2: turn snapshot diffs into proposals. Shadow by default (writes
      # proposals.json, no Airtable rows). Cost-guarded: one Gemini call per
      # changed URL, aborts on a flood (MAX_ASSESS). continue-on-error so a
      # Gemini hiccup never fails the scan itself.
      - name: Assess changes into proposals
        if: github.event.inputs.mode != 'baseline'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SHADOW: ${{ vars.PROPOSALS_SHADOW || 'true' }}
        run: python .github/scripts/assess.py

      - name: Post digest to Slack
        if: always() && github.event.inputs.mode != 'baseline'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          QUEUE_URL: ${{ vars.PROPOSALS_QUEUE_URL }}
          REVIEW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/notify_slack.py

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vendor-scan
          path: |
            changed-pages.md
            scan-summary.json
            proposals.json
          if-no-files-found: ignore

      - name: Commit diff and snapshots
        if: always()
        run: |
          git config user.name  "speero-sync-bot"
          git config user.email "sync@speero.com"
          # snapshots/ is the committed change set (P1): git diff on it is what
          # assess.py (P2) turns into proposals.
          git add changed-pages.md snapshots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Enrichment monitor: scan + snapshots [$(date -u +%Y-%m-%d)]"
            git push
          fi
